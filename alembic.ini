# Database migrations. Common commands (run from the project folder):
#   alembic upgrade head                               create / update the tables
#   alembic revision --autogenerate -m "what changed"  after editing db/models.py
#   alembic downgrade -1                               undo the last migration
# The database comes from DATABASE_URL (environment or .env), like the app.

[alembic]
script_location = %(here)s/src/iq_connect/db/migrations
prepend_sys_path = src
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
