[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "iq-connect"
version = "0.1.0"
description = "One Claude connector for Fabric, Databricks and Snowflake, scoped per user and read-only."
# Deployed on 3.14 (runtime.txt); the code stays compatible with 3.12 so it
# also runs on machines that only have 3.12.
requires-python = ">=3.12"
# requirements.txt stays the single list of runtime dependencies, so the
# pinned versions there are what both `pip install -r` and this package use.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import from src/ directly, so they run without `pip install -e .`;
# tests/ itself holds shared helpers such as the fake Claude client.
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Migration files are generated by Alembic; they are reviewed, not restyled.
extend-exclude = ["src/iq_connect/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
